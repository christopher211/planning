<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1C22" media="(prefers-color-scheme: dark)">
<title>Trip Timeline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Trip <em>Timeline</em></h1>
      <p class="tagline">Drag a day to reshuffle it — dates always stay in trip order. Flag what's a must and what can slip.</p>
    </div>
    <div class="header-actions">
      <button class="open-btn" id="openBtn" type="button">Open PDF</button>
      <input class="file-input" id="fileInput" type="file" accept="application/pdf,.pdf" tabindex="-1" aria-hidden="true">
      <button class="reset-btn" id="resetBtn" type="button">clear all</button>
      <button class="export-btn" id="exportBtn" type="button">Export PDF</button>
    </div>
  </header>

  <div class="toolbar">
    <ul class="legend" id="legend"></ul>
    <div class="toolbar-actions">
      <button class="text-btn" id="sortDateBtn" type="button"
              title="Put the day sections back in date order and each day's plans in time order">sort by date</button>
      <div class="seg" id="fmtToggle" role="group" aria-label="Date entry format">
        <button type="button" data-fmt="mdy" title="Type dates as month / day / year">MM/DD</button>
        <button type="button" data-fmt="dmy" title="Type dates as day / month / year">DD/MM</button>
      </div>
    </div>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="add-day-row">
    <div class="add-day-rail"><span class="dot-ghost"></span></div>
    <div id="addDayArea"></div>
  </div>
</div>

<div id="printView"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- plain scripts, loaded in dependency order, so the page also works opened straight from disk -->
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/datefield.js"></script>
<script src="js/dnd.js"></script>
<script src="js/view.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
