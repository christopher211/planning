<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1C22" media="(prefers-color-scheme: dark)">
<title>Trip Timeline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body>

<div class="banner hidden" id="banner">
  <span class="banner-text" id="bannerText"></span>
  <span class="banner-actions">
    <button class="banner-btn" id="bannerSave" type="button"></button>
    <button class="banner-btn ghost" id="bannerLeave" type="button"></button>
  </span>
</div>

<!-- ---------- sticky header ---------- -->
<header class="topbar" id="topbar">
  <div class="topbar-left">
    <h1><span id="title1">Trip</span> <em id="title2">Timeline</em></h1>
    <button class="trips-btn" id="tripsBtn" type="button">
      <span class="trip-star hidden">★</span><span class="trip-name"></span><span class="trip-caret">▾</span>
    </button>
  </div>
  <div class="topbar-right">
    <div class="seg" id="viewToggle" role="group">
      <button type="button" data-view="timeline"></button>
      <button type="button" data-view="calendar"></button>
    </div>
    <button class="icon-toggle" id="sidebarBtn" type="button" aria-expanded="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2"/><path d="M10 2.6v10.8"/>
      </svg>
    </button>
  </div>
</header>

<div class="shell">
  <!-- ---------- board ---------- -->
  <main class="board-wrap" id="boardWrap">
    <div class="board-bar">
      <button class="text-btn" id="sortDateBtn" type="button"></button>
      <span class="board-hint" id="boardHint"></span>
    </div>
    <div class="board" id="timeline"></div>
  </main>

  <!-- ---------- sidebar ---------- -->
  <aside class="sidebar" id="sidebar">
    <div class="side-group">
      <p class="side-title" id="sideActions"></p>
      <button class="open-btn" id="shareBtn" type="button"></button>
      <button class="open-btn" id="icsBtn" type="button"></button>
      <button class="open-btn" id="openBtn" type="button"></button>
      <input class="file-input" id="fileInput" type="file" accept="application/pdf,.pdf" tabindex="-1" aria-hidden="true">
      <button class="export-btn" id="exportBtn" type="button"></button>
    </div>

    <div class="side-group">
      <p class="side-title" id="sideFormat"></p>
      <div class="seg" id="fmtToggle" role="group">
        <button type="button" data-fmt="dmy">DD/MM</button>
        <button type="button" data-fmt="mdy">MM/DD</button>
      </div>
      <div class="seg" id="langToggle" role="group">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="vi">VI</button>
      </div>
    </div>

    <div class="side-group">
      <p class="side-title" id="sideLegend"></p>
      <ul class="legend" id="legend"></ul>
    </div>

    <div class="side-group side-foot">
      <button class="reset-btn" id="resetBtn" type="button"></button>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
</div>

<!-- floating add-day control -->
<div class="fab-wrap" id="fabWrap">
  <div class="fab-panel hidden" id="fabPanel"></div>
  <button class="fab" id="addDayFab" type="button" aria-expanded="false">
    <span class="fab-plus">+</span><span class="fab-label"></span>
  </button>
</div>

<!-- trip library -->
<div class="modal-backdrop hidden" id="tripsModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tripsTitle">
    <h2 id="tripsTitle"></h2>
    <ul class="trip-list" id="tripList"></ul>
    <div class="modal-actions">
      <button class="cancel-btn" id="tripsClose" type="button"></button>
      <button class="confirm-btn" id="tripNew" type="button"></button>
    </div>
  </div>
</div>

<!-- one day, opened from a calendar cell on small screens -->
<div class="modal-backdrop hidden" id="dayModal">
  <div class="modal day-modal" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
    <h2 id="dayModalTitle"></h2>
    <div class="day-modal-body" id="dayModalBody"></div>
    <div class="modal-actions day-modal-actions">
      <button class="text-btn" id="dayModalSort" type="button"></button>
      <button class="icon-btn" id="dayModalDelete" type="button">×</button>
      <span class="spacer"></span>
      <button class="cancel-btn" id="dayModalClose" type="button"></button>
      <button class="confirm-btn" id="dayModalAdd" type="button"></button>
    </div>
  </div>
</div>

<!-- share sheet -->
<div class="modal-backdrop hidden" id="shareModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <h2 id="shareTitle"></h2>
    <p class="modal-body" id="shareBody"></p>
    <div class="share-modes" id="shareModes">
      <label><input type="radio" name="shareMode" value="view" checked><span id="shareModeView"></span></label>
      <label><input type="radio" name="shareMode" value="edit"><span id="shareModeEdit"></span></label>
    </div>
    <input class="share-link" id="shareLink" type="text" readonly>
    <p class="modal-note" id="shareNote"></p>
    <div class="modal-actions">
      <button class="cancel-btn" id="shareClose" type="button"></button>
      <button class="confirm-btn" id="shareCopy" type="button"></button>
    </div>
  </div>
</div>

<div id="printView"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Plain scripts, loaded in dependency order, so the page also works opened
     straight from disk. The ?v= stamp is a cache buster: bump it whenever you
     deploy, or a returning visitor can run cached JS against fresh HTML. -->
<script src="js/util.js?v=9"></script>
<script src="js/i18n.js?v=9"></script>
<script src="js/store.js?v=9"></script>
<script src="js/datefield.js?v=9"></script>
<script src="js/dnd.js?v=9"></script>
<script src="js/calendar.js?v=9"></script>
<script src="js/view.js?v=9"></script>
<script src="js/pdf.js?v=9"></script>
<script src="js/share.js?v=9"></script>
<script src="js/ics.js?v=9"></script>
<script src="js/trips.js?v=9"></script>
<script src="js/app.js?v=9"></script>
</body>
</html>
